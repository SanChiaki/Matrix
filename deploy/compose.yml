# Matrix 部署：只有 matrix 一个容器，端口只发布到宿主机的 127.0.0.1（MATRIX_BIND / MATRIX_PORT 可改）。
# 对外怎么暴露（HTTPS、域名、额外的登录层）由部署方自己的反向代理负责，不在这里：要求与 Caddy 示例见 docs/reverse-proxy.md。
# 用法见 deploy/README.md。机密（模型凭据等）都在 deploy/.env 或卷里，不进仓库。
name: matrix

services:
  matrix:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        IM_DRIVERS: ${MATRIX_IM_DRIVERS:-}   # 企业内部 IM 的驱动包，见 docs/im-driver-authoring.md
        LOGIN_DRIVERS: ${MATRIX_LOGIN_DRIVERS:-}   # 公司统一登录的驱动包，见 docs/login-driver-authoring.md
        # 无公网构建的镜像源，空着 = 官方源；见 README「内网 / 无公网构建」
        APT_MIRROR: ${MATRIX_APT_MIRROR:-}
        NPM_REGISTRY: ${MATRIX_NPM_REGISTRY:-}
        PYPI_INDEX: ${MATRIX_PYPI_INDEX:-}
        NODE_TARBALL: ${MATRIX_NODE_TARBALL:-}
    restart: unless-stopped
    volumes:
      - matrix-data:/data            # Matrix 状态（state.json、对话、任务、Agent 私有目录、群组档案）
      - dsh-home:/home/matrix/.dsh   # dsh 的配置、会话与模型凭据
    env_file:
      - path: .env
        required: false
    ports:
      # 默认只发布到宿主机的回环地址：宿主机上的反向代理转到这里；代理跑在容器里时改为加入 internal 网络（docs/reverse-proxy.md），
      # 这一行可以删掉。不要改成 0.0.0.0 直接对外：Matrix 自己没有 HTTPS，也不挡 /internal/*
      - "${MATRIX_BIND:-127.0.0.1}:${MATRIX_PORT:-8765}:8765"
    # dsh 在 Linux 上用 bwrap 沙箱（没有可用沙箱时 fail closed，命令不执行）。bwrap 在容器里要建 user/pid 命名空间、
    # 挂 /proc：默认 seccomp 和被遮住的 /proc 路径会拦。放开这两项会削弱容器自身的隔离，换来 Agent 命令的文件级限制。
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    cap_drop: [ALL]
    networks: [internal]

volumes:
  matrix-data:
  dsh-home:

networks:
  internal:   # 反向代理以容器方式运行时加入这个网络（compose 里的名字是 matrix_internal），用 matrix:8765 访问
