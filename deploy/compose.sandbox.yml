# 云侧执行面：docker 后端（docs/cloud-runtime.md 阶段 1b）。叠在 compose.yml 上用，默认部署不受影响：
#   cp sandboxd.example.json sandboxd.json            # 按需改运行时（runsc / insecure-runc）、镜像名、配额
#   docker compose -f compose.yml -f compose.sandbox.yml --profile build build   # 构建沙箱镜像与管理器
#   docker compose -f compose.yml -f compose.sandbox.yml up -d
# 回退：去掉 -f compose.sandbox.yml 再 up -d（见 README「云侧执行面：docker 后端」）。
services:
  matrix:
    environment:
      MATRIX_CLOUD_SANDBOX: docker
      MATRIX_SANDBOXD_SOCKET: /run/matrix-sandboxd/sandboxd.sock
    volumes:
      - sandboxd-run:/run/matrix-sandboxd      # 只有这个目录通向管理器；docker.sock 不挂进来
    # Matrix 不再跑 dsh：不用再放开 seccomp 与 /proc 遮挡（compose.yml 里那两项是给容器里的 bwrap 的）
    security_opt: !override
      - no-new-privileges
    # 沙箱客户端连回来：只在沙箱网络的网关上开放 8765（沙箱之间不互通，到网关的流量放行）。
    # 这一阶段沙箱还能访问 Matrix 的其他接口（都要登录或执行上下文令牌）；阶段 2 改成只经出口网关
    ports:
      - "${MATRIX_SANDBOX_GATEWAY:-172.31.255.1}:8765:8765"
    depends_on: [sandboxd]

  # 沙箱管理器：唯一挂 docker.sock 的服务（docker.sock 等于宿主 root）。不对外监听，只在共享卷里开一个 Unix socket
  sandboxd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sandbox
      target: sandboxd
      args: &sandbox_args
        APT_MIRROR: ${MATRIX_APT_MIRROR:-}
        NPM_REGISTRY: ${MATRIX_NPM_REGISTRY:-}
        PYPI_INDEX: ${MATRIX_PYPI_INDEX:-}
        NODE_TARBALL: ${MATRIX_NODE_TARBALL:-}
    image: matrix-sandboxd:local
    restart: unless-stopped
    # socket 0660、属组是 matrix 服务的用户组（gid 1000）：只有它连得上。管理器进程加进这个组，改属组不需要 CHOWN 特权
    command: ["matrix-sandboxd", "--socket-mode", "660", "--socket-group", "1000"]
    group_add: ["1000"]
    environment:
      MATRIX_SANDBOXD_CONFIG: /etc/matrix/sandboxd.json
      DOCKER_CONFIG: /tmp/.docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandboxd-run:/run/matrix-sandboxd
      - ./sandboxd.json:/etc/matrix/sandboxd.json:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks: [sandbox]                        # 只为让 compose 建出沙箱网络；它自己不监听任何端口

  # 只用来构建沙箱镜像（不运行）：管理器按 sandboxd.json 的 image 起沙箱容器
  sandbox-image:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sandbox
      target: sandbox
      args: *sandbox_args
    image: matrix-sandbox:local
    profiles: [build]

volumes:
  sandboxd-run:

networks:
  # 沙箱专用网络：容器之间不互通（enable_icc=false），能到的只有网关上开放的 Matrix 与外网（阶段 2 改成只到出口网关）
  sandbox:
    name: matrix-sandbox
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: ${MATRIX_SANDBOX_SUBNET:-172.31.255.0/24}
          gateway: ${MATRIX_SANDBOX_GATEWAY:-172.31.255.1}
