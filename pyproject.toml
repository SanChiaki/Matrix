[project]
name = "matrix"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
matrix = "matrix.server:main"
matrix-connect = "matrix.connector.main:main"
matrix-plugin = "matrix.plugin_check:main"
matrix-dsh-check = "matrix.dsh_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 读写文本不写编码时，Windows 上（Python 3.14）按区域编码（cp1252 / GBK）处理，中文就会坏。
# 设了 PYTHONWARNDEFAULTENCODING=1（CI 三端都设）时这类调用一律算失败，在哪个系统上都能发现。
filterwarnings = ["error::EncodingWarning"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
