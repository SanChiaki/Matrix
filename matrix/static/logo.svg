<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="matrix-logo-title">
  <title id="matrix-logo-title">Matrix</title>
  <defs>
    <linearGradient id="matrix-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b93ff"/>
      <stop offset="1" stop-color="#4f55c9"/>
    </linearGradient>
  </defs>
  <!-- 3×3 的节点矩阵：一条连线穿过其中七个节点写出 M，另外两个是还没连上的节点 -->
  <rect width="64" height="64" rx="16" fill="url(#matrix-bg)"/>
  <path d="M18 46V18l14 14 14-14v28" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff">
    <circle cx="18" cy="18" r="4.5"/><circle cx="18" cy="32" r="4.5"/><circle cx="18" cy="46" r="4.5"/>
    <circle cx="32" cy="32" r="4.5"/>
    <circle cx="46" cy="18" r="4.5"/><circle cx="46" cy="32" r="4.5"/><circle cx="46" cy="46" r="4.5"/>
  </g>
  <g fill="#fff" opacity=".38">
    <circle cx="32" cy="18" r="3.5"/><circle cx="32" cy="46" r="3.5"/>
  </g>
</svg>
