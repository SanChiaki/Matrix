[project]
name = "matrix-device-demo"
version = "0.1.0"
description = "演示用的 matrix-connect 外部驱动：把业务系统自己的设备端 Agent 接进 Matrix 的样板"
requires-python = ">=3.14"
# 装进 matrix-connect 所在的环境里用：matrix 本身由那个环境提供，这里不写；这个样板只用标准库
dependencies = []

# matrix-connect 按这个 entry point 发现驱动：名字随意，值指向驱动类（类的 name 才是 harness 名）
[project.entry-points."matrix.connect_drivers"]
demo-agent = "matrix_device_demo.driver:DemoAgentDriver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matrix_device_demo"]
