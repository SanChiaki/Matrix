[project]
name = "matrix-im-demo"
version = "0.1.0"
description = "演示 IM 的 Matrix 驱动：企业内部 IM 接入的样板"
requires-python = ">=3.14"
# 装进 Matrix 所在的环境里用：matrix 本身由那个环境提供，这里不写；websockets 是 Matrix 已有的依赖
dependencies = ["websockets>=17.2"]

# Matrix 按这个 entry point 发现驱动：名字随意，值指向 Driver 子类
[project.entry-points."matrix.im_drivers"]
demo-im = "matrix_im_demo.driver:DemoDriver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matrix_im_demo"]
