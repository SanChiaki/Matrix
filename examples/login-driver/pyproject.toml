[project]
name = "matrix-login-demo"
version = "0.1.0"
description = "演示 SSO 的 Matrix 登录驱动：公司统一登录接入的样板"
requires-python = ">=3.14"
# 装进 Matrix 所在的环境里用：matrix 本身由那个环境提供，这里不写；这个样板只用标准库
dependencies = []

# Matrix 按这个 entry point 发现驱动：名字随意，值指向 Driver 子类
[project.entry-points."matrix.login_drivers"]
demo-sso = "matrix_login_demo.driver:DemoDriver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matrix_login_demo"]
